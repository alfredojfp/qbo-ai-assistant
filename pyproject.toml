[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexter-qbo-assistant"
version = "4.1.0-dev"
description = "Dexter — AI-powered QuickBooks Online assistant with 102 tools and multi-company support"
readme = "README.md"
license = {text = "Proprietary — All Rights Reserved"}
authors = [
    {name = "Alfredo", email = "alfredojfp@github.com"}
]
keywords = ["quickbooks", "accounting", "ai", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "pandas>=1.5.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ocr = [
    "PyPDF2>=3.0.0",
    "pdf2image>=1.16.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
ocr = [
    "pdf2image>=1.16.0",
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
all = [
    "dexter-qbo-assistant[dev]",
]

[project.scripts]
dexter = "main:main_loop"

[project.urls]
Homepage = "https://github.com/alfredojfp/qbo-ai-assistant"
Documentation = "https://github.com/alfredojfp/qbo-ai-assistant/tree/main/docs"
Repository = "https://github.com/alfredojfp/qbo-ai-assistant"
Issues = "https://github.com/alfredojfp/qbo-ai-assistant/issues"

[tool.setuptools]
packages = ["dexter", "dexter.core", "dexter.tools", "dexter.testing", "autonomia", "scripts"]

[tool.setuptools.package-data]
dexter = ["*.py", "**/*.py"]
autonomia = ["*.py"]
scripts = ["*.py"]
