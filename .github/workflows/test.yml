name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil
          # No requirements.txt — dexter uses stdlib + requests only

      - name: Run integrity check
        run: |
          python scripts/verify_tool_integrity.py

      - name: Run full test suite
        env:
          QB_ACCESS_TOKEN: ci-dummy-token
          QB_REALM_ID: "9341455870833544"
          QB_ENV: development
          QB_REDIRECT_URI: "http://localhost:8000/callback"
          OPENROUTER_API_KEY: ci-dummy-key
        run: |
          python -m unittest discover tests/ -v 2>&1 | tail -30

      - name: Verify E2E suite is discoverable (skipped)
        env:
          RUN_E2E_SANDBOX: "1"
        run: |
          python -m unittest tests.test_e2e_sandbox 2>&1 | tail -5 || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile-check main.py
        run: |
          python -m py_compile main.py
          python -m py_compile company_manager.py
          python -m py_compile scripts/verify_tool_integrity.py
          echo "main.py compiles OK"

      - name: Verify pre-commit hook exists
        run: |
          test -f .githooks/pre-commit && echo "pre-commit hook present"
